name: Battleground X — Unity CI

# Triggers: push to main/develop, or any pull request
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── Environment ────────────────────────────────────────────────────────────────
env:
  UNITY_VERSION: 2022.3.62f1
  PROJECT_PATH: .          # workflow runs from BattlegroundX_Project/

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Activate & Validate ──────────────────────────────────────────────────
  validate:
    name: Activate & Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-
            Library-

      # GameCI: https://game.ci
      - name: Activate Unity & run validation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:      ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:        ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:     ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:       ${{ env.UNITY_VERSION }}
          projectPath:        ${{ env.PROJECT_PATH }}
          buildMethod:        ""       # validation only — no build method
          allowDirtyBuild:    true

  # ── 2. Build Android ────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-Android-${{ env.UNITY_VERSION }}-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:      ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:        ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:     ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:       ${{ env.UNITY_VERSION }}
          projectPath:        ${{ env.PROJECT_PATH }}
          targetPlatform:     Android
          androidExportType:  androidPackage   # produces .apk
          versioning:         Semantic

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BattlegroundX-Android
          path: build/Android/*.apk
          retention-days: 14

  # ── 3. Build Windows ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    needs: validate

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-Windows-${{ env.UNITY_VERSION }}-

      - name: Build Windows x64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:      ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:        ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:     ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:       ${{ env.UNITY_VERSION }}
          projectPath:        ${{ env.PROJECT_PATH }}
          targetPlatform:     StandaloneWindows64
          versioning:         Semantic

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BattlegroundX-Windows64
          path: build/StandaloneWindows64/
          retention-days: 14
